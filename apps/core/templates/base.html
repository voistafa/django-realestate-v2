{% load static %}

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="{% block meta_description %}سامانه حرفه‌ای معرفی املاک و پروژه‌های ساختمانی{% endblock %}"
    >

    <title>
        {% block title %}سامانه املاک{% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{% static 'core/css/main.css' %}"
    >

    {% block extra_css %}{% endblock %}
</head>

<body>
    <header>
        {% block header %}{% endblock %}
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        {% block footer %}{% endblock %}
    </footer>

    {% block extra_js %}{% endblock %}
</body>
</html>
