    <script>
        (function () {
            "use strict";

            const originalGettext = window.gettext;

            window.gettext = function (message) {
                if (message === "Available %s") {
                    return "%s موجود";
                }

                return originalGettext.apply(
                    this,
                    arguments
                );
            };
        }());

    <script>
        (function () {
            "use strict";

            const selectIds = [
                "id_construction_status",
                "id_publication_status"
            ];

            function closeCustomSelect(wrapper) {
                wrapper.classList.remove("is-open");

                const button = wrapper.querySelector(
                    ".project-status-select-button"
                );

                if (button) {
                    button.setAttribute(
                        "aria-expanded",
                        "false"
                    );
                }
            }

            function closeOtherCustomSelects(
                currentWrapper
            ) {
                document
                    .querySelectorAll(
                        ".project-status-custom-select.is-open"
                    )
                    .forEach(function (wrapper) {
                        if (wrapper !== currentWrapper) {
                            closeCustomSelect(wrapper);
                        }
                    });
            }

            function buildCustomSelect(selectId) {
                const select = document.getElementById(
                    selectId
                );

                if (!select) {
                    return;
                }

                if (
                    select.dataset
                        .projectCustomSelectReady ===
                    "true"
                ) {
                    return;
                }

                select.dataset
                    .projectCustomSelectReady =
                    "true";

                const wrapper =
                    document.createElement("div");

                wrapper.className =
                    "project-status-custom-select";

                select.parentNode.insertBefore(
                    wrapper,
                    select
                );

                wrapper.appendChild(select);

                select.classList.add(
                    "project-status-native-select"
                );

                const button =
                    document.createElement("button");

                button.type = "button";

                button.className =
                    "project-status-select-button";

                button.setAttribute(
                    "aria-haspopup",
                    "listbox"
                );

                button.setAttribute(
                    "aria-expanded",
                    "false"
                );

                const buttonText =
                    document.createElement("span");

                buttonText.className =
                    "project-status-select-button-text";

                const arrow =
                    document.createElement("span");

                arrow.className =
                    "project-status-select-arrow";

                arrow.setAttribute(
                    "aria-hidden",
                    "true"
                );

                button.appendChild(buttonText);
                button.appendChild(arrow);

                const optionsContainer =
                    document.createElement("div");

                optionsContainer.className =
                    "project-status-options";

                optionsContainer.setAttribute(
                    "role",
                    "listbox"
                );

                wrapper.appendChild(button);
                wrapper.appendChild(optionsContainer);

                function updateSelectedOption() {
                    const selectedOption =
                        select.options[
                            select.selectedIndex
                        ];

                    buttonText.textContent =
                        selectedOption
                            ? selectedOption.text.trim()
                            : "";

                    optionsContainer
                        .querySelectorAll(
                            ".project-status-option"
                        )
                        .forEach(function (optionButton) {
                            const isSelected =
                                optionButton.dataset
                                    .value ===
                                select.value;

                            optionButton.classList.toggle(
                                "is-selected",
                                isSelected
                            );

                            optionButton.setAttribute(
                                "aria-selected",
                                isSelected
                                    ? "true"
                                    : "false"
                            );
                        });
                }

                Array.from(select.options).forEach(
                    function (option) {
                        const optionButton =
                            document.createElement(
                                "button"
                            );

                        optionButton.type = "button";

                        optionButton.className =
                            "project-status-option";

                        optionButton.textContent =
                            option.text.trim();

                        optionButton.dataset.value =
                            option.value;

                        optionButton.disabled =
                            option.disabled;

                        optionButton.setAttribute(
                            "role",
                            "option"
                        );

                        optionButton.addEventListener(
                            "click",
                            function () {
                                if (
                                    optionButton.disabled
                                ) {
                                    return;
                                }

                                select.value =
                                    option.value;

                                select.dispatchEvent(
                                    new Event(
                                        "change",
                                        {
                                            bubbles: true
                                        }
                                    )
                                );

                                updateSelectedOption();
                                closeCustomSelect(wrapper);
                                button.focus();
                            }
                        );

                        optionButton.addEventListener(
                            "keydown",
                            function (event) {
                                const options =
                                    Array.from(
                                        optionsContainer
                                            .querySelectorAll(
                                                ".project-status-option:not(:disabled)"
                                            )
                                    );

                                const currentIndex =
                                    options.indexOf(
                                        optionButton
                                    );

                                if (
                                    event.key ===
                                    "ArrowDown"
                                ) {
                                    event.preventDefault();

                                    const nextOption =
                                        options[
                                            (
                                                currentIndex +
                                                1
                                            ) %
                                            options.length
                                        ];

                                    nextOption.focus();
                                }

                                if (
                                    event.key ===
                                    "ArrowUp"
                                ) {
                                    event.preventDefault();

                                    const previousIndex =
                                        (
                                            currentIndex -
                                            1 +
                                            options.length
                                        ) %
                                        options.length;

                                    options[
                                        previousIndex
                                    ].focus();
                                }

                                if (
                                    event.key ===
                                    "Escape"
                                ) {
                                    event.preventDefault();

                                    closeCustomSelect(
                                        wrapper
                                    );

                                    button.focus();
                                }
                            }
                        );

                        optionsContainer.appendChild(
                            optionButton
                        );
                    }
                );

                button.addEventListener(
                    "click",
                    function () {
                        const shouldOpen =
                            !wrapper.classList.contains(
                                "is-open"
                            );

                        closeOtherCustomSelects(
                            wrapper
                        );

                        wrapper.classList.toggle(
                            "is-open",
                            shouldOpen
                        );

                        button.setAttribute(
                            "aria-expanded",
                            shouldOpen
                                ? "true"
                                : "false"
                        );

                        if (shouldOpen) {
                            const selectedButton =
                                optionsContainer
                                    .querySelector(
                                        ".project-status-option.is-selected"
                                    );

                            if (selectedButton) {
                                selectedButton.focus();
                            }
                        }
                    }
                );

                button.addEventListener(
                    "keydown",
                    function (event) {
                        if (
                            event.key ===
                                "ArrowDown" ||
                            event.key ===
                                "ArrowUp"
                        ) {
                            event.preventDefault();

                            closeOtherCustomSelects(
                                wrapper
                            );

                            wrapper.classList.add(
                                "is-open"
                            );

                            button.setAttribute(
                                "aria-expanded",
                                "true"
                            );

                            const selectedButton =
                                optionsContainer
                                    .querySelector(
                                        ".project-status-option.is-selected"
                                    );

                            const firstButton =
                                optionsContainer
                                    .querySelector(
                                        ".project-status-option:not(:disabled)"
                                    );

                            (
                                selectedButton ||
                                firstButton
                            )?.focus();
                        }

                        if (
                            event.key ===
                            "Escape"
                        ) {
                            closeCustomSelect(wrapper);
                        }
                    }
                );

                select.addEventListener(
                    "change",
                    updateSelectedOption
                );

                document.addEventListener(
                    "click",
                    function (event) {
                        if (
                            !wrapper.contains(
                                event.target
                            )
                        ) {
                            closeCustomSelect(wrapper);
                        }
                    }
                );

                updateSelectedOption();
            }

            function startCustomSelects() {
                selectIds.forEach(
                    buildCustomSelect
                );
            }

            if (
                document.readyState === "loading"
            ) {
                document.addEventListener(
                    "DOMContentLoaded",
                    startCustomSelects,
                    {
                        once: true
                    }
                );
            } else {
                startCustomSelects();
            }
        }());
    </script>

    <script>
        (function () {
            "use strict";

            const persianDigits =
                "۰۱۲۳۴۵۶۷۸۹";

            function convertToPersianDigits(
                value
            ) {
                return value.replace(
                    /[0-9]/g,
                    function (digit) {
                        return persianDigits[
                            Number(digit)
                        ];
                    }
                );
            }

            function localizeCalendarDigits(
                calendar
            ) {
                const walker =
                    document.createTreeWalker(
                        calendar,
                        NodeFilter.SHOW_TEXT
                    );

                const textNodes = [];

                while (walker.nextNode()) {
                    textNodes.push(
                        walker.currentNode
                    );
                }

                textNodes.forEach(
                    function (node) {
                        const currentText =
                            node.nodeValue || "";

                        const localizedText =
                            convertToPersianDigits(
                                currentText
                            );

                        if (
                            currentText !==
                            localizedText
                        ) {
                            node.nodeValue =
                                localizedText;
                        }
                    }
                );
            }

            function connectToCalendar() {
                const calendar =
                    document.getElementById(
                        "ui-datepicker-div"
                    );

                if (!calendar) {
                    return false;
                }

                if (
                    calendar.dataset
                        .persianDigitsConnected ===
                    "true"
                ) {
                    return true;
                }

                calendar.dataset
                    .persianDigitsConnected =
                    "true";

                localizeCalendarDigits(
                    calendar
                );

                const calendarObserver =
                    new MutationObserver(
                        function () {
                            localizeCalendarDigits(
                                calendar
                            );
                        }
                    );

                calendarObserver.observe(
                    calendar,
                    {
                        childList: true,
                        characterData: true,
                        subtree: true
                    }
                );

                return true;
            }

            function startPersianCalendarDigits() {
                if (connectToCalendar()) {
                    return;
                }

                const calendarFinder =
                    new MutationObserver(
                        function () {
                            if (
                                connectToCalendar()
                            ) {
                                calendarFinder
                                    .disconnect();
                            }
                        }
                    );

                calendarFinder.observe(
                    document.documentElement,
                    {
                        childList: true,
                        subtree: true
                    }
                );
            }

            if (
                document.readyState === "loading"
            ) {
                document.addEventListener(
                    "DOMContentLoaded",
                    startPersianCalendarDigits,
                    {
                        once: true
                    }
                );
            } else {
                startPersianCalendarDigits();
            }
        }());
    </script>


    <script>
        (function () {
            "use strict";

            function normalizeText(value) {
                return (value || "")
                    .replace(/\s+/g, " ")
                    .trim();
            }

            function alignPublishedAtLabel() {
                const row = document.querySelector(
                    "#content-main .form-row.field-published_at"
                );

                if (!row) {
                    return;
                }

                const label = Array.from(
                    row.querySelectorAll("label")
                ).find(function (item) {
                    return normalizeText(
                        item.textContent
                    ).startsWith(
                        "تاریخ و زمان انتشار"
                    );
                });

                if (!label) {
                    return;
                }

                label.style.setProperty(
                    "position",
                    "relative",
                    "important"
                );

                label.style.setProperty(
                    "top",
                    "auto",
                    "important"
                );

                label.style.setProperty(
                    "transform",
                    "translateY(10px)",
                    "important"
                );
            }

            function startPublishedAtAlignment() {
                alignPublishedAtLabel();

                window.setTimeout(
                    alignPublishedAtLabel,
                    0
                );

                window.setTimeout(
                    alignPublishedAtLabel,
                    150
                );
            }

            if (document.readyState === "loading") {
                document.addEventListener(
                    "DOMContentLoaded",
                    startPublishedAtAlignment,
                    { once: true }
                );
            } else {
                startPublishedAtAlignment();
            }
        }());
    </script>


    <script>
        (function () {
            "use strict";

            function createPublishedAtLabel(text) {
                const label = document.createElement("span");

                label.className =
                    "project-published-datetime-label";

                label.textContent = text;

                label.style.setProperty(
                    "font-size",
                    "16px",
                    "important"
                );

                label.style.setProperty(
                    "font-weight",
                    "400",
                    "important"
                );

                label.style.setProperty(
                    "line-height",
                    "1.75",
                    "important"
                );

                return label;
            }

            function rebuildPublishedAtLayout() {
                const datetime = document.querySelector(
                    "#content-main "
                    + ".form-row.field-published_at "
                    + ".datetime"
                );

                const dateInput = document.getElementById(
                    "id_published_at_0"
                );

                const timeInput = document.getElementById(
                    "id_published_at_1"
                );

                if (!datetime || !dateInput || !timeInput) {
                    return;
                }

                if (
                    datetime.dataset
                        .projectPublishedLayoutReady ===
                    "true"
                ) {
                    return;
                }

                const dateGroup =
                    document.createElement("span");

                dateGroup.className =
                    "project-published-datetime-group "
                    + "project-published-date-group";

                const timeGroup =
                    document.createElement("span");

                timeGroup.className =
                    "project-published-datetime-group "
                    + "project-published-time-group";

                const dateLabel =
                    createPublishedAtLabel("تاریخ:");

                const timeLabel =
                    createPublishedAtLabel("زمان:");

                dateGroup.append(
                    dateLabel,
                    dateInput
                );

                timeGroup.append(
                    timeLabel,
                    timeInput
                );

                datetime.replaceChildren(
                    dateGroup,
                    timeGroup
                );

                datetime.classList.add(
                    "project-published-datetime-layout"
                );

                datetime.dataset
                    .projectPublishedLayoutReady =
                    "true";
            }

            function startPublishedAtLayout() {
                rebuildPublishedAtLayout();

                window.setTimeout(
                    rebuildPublishedAtLayout,
                    0
                );

                window.setTimeout(
                    rebuildPublishedAtLayout,
                    150
                );
            }

            if (document.readyState === "loading") {
                document.addEventListener(
                    "DOMContentLoaded",
                    startPublishedAtLayout,
                    { once: true }
                );
            } else {
                startPublishedAtLayout();
            }
        }());
    </script>

    <script>
        (function () {
            "use strict";

            function normalizePublishedAtText(value) {
                return (value || "")
                    .replace(/\s+/g, " ")
                    .trim();
            }

            function removeOnlyStrayTimeLabel() {
                const row = document.querySelector(
                    "#content-main .form-row.field-published_at"
                );

                if (!row) {
                    return;
                }

                /*
                 * برچسب استاندارد زمان که باید باقی بماند، داخل
                 * project-published-time-group قرار دارد.
                 * فقط نمونه قدیمی/اضافی خارج از این گروه حذف می‌شود.
                 */
                row.querySelectorAll(
                    "label, span, strong, b"
                ).forEach(function (element) {
                    const isWantedTimeLabel = Boolean(
                        element.closest(
                            ".project-published-time-group"
                        )
                    );

                    const isExactStrayLabel =
                        normalizePublishedAtText(
                            element.textContent
                        ) === "زمان:";

                    if (
                        isExactStrayLabel
                        && !isWantedTimeLabel
                        && !element.querySelector("input")
                    ) {
                        element.remove();
                    }
                });

                const walker = document.createTreeWalker(
                    row,
                    NodeFilter.SHOW_TEXT
                );

                const strayTextNodes = [];
                let textNode = walker.nextNode();

                while (textNode) {
                    const parent = textNode.parentElement;
                    const isWantedTimeLabel = Boolean(
                        parent
                        && parent.closest(
                            ".project-published-time-group"
                        )
                    );

                    if (
                        normalizePublishedAtText(
                            textNode.nodeValue
                        ) === "زمان:"
                        && !isWantedTimeLabel
                    ) {
                        strayTextNodes.push(textNode);
                    }

                    textNode = walker.nextNode();
                }

                strayTextNodes.forEach(function (node) {
                    node.remove();
                });
            }

            function startStrayTimeCleanup() {
                removeOnlyStrayTimeLabel();

                window.setTimeout(
                    removeOnlyStrayTimeLabel,
                    0
                );

                window.setTimeout(
                    removeOnlyStrayTimeLabel,
                    200
                );

                window.setTimeout(
                    removeOnlyStrayTimeLabel,
                    500
                );
            }

            if (document.readyState === "loading") {
                document.addEventListener(
                    "DOMContentLoaded",
                    startStrayTimeCleanup,
                    { once: true }
                );
            } else {
                startStrayTimeCleanup();
            }
        }());
    </script>
